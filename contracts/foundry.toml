[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# Heavier run before the ABI freeze and for report evidence: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 1000
depth = 128

[fmt]
line_length = 120
